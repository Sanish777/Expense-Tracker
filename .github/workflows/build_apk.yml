name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Prepare APK Folder and Rename
        run: |
          mkdir -p apk
          DATE=$(date +'%d_%m_%Y')
          cp build/app/outputs/flutter-apk/app-release.apk apk/exp_track_$DATE.apk
          echo "APK generated: apk/exp_track_$DATE.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: apk/exp_track_*.apk
          retention-days: 30

      - name: Commit APK to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apk/exp_track_*.apk
          git commit -m "Auto-generated APK for $(date +'%d_%m_%Y')" || echo "No changes to commit"
          git push

