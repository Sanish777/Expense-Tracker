name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Prepare APK Folder and Rename
        run: |
          mkdir -p apk
          DATE=$(date +'%d_%m_%Y')
          cp build/app/outputs/flutter-apk/app-release.apk apk/exp_track_$DATE.apk
          echo "APK generated: apk/exp_track_$DATE.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: apk/exp_track_*.apk
          retention-days: 30
