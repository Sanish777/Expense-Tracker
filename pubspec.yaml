name: spendwise_ai
description: "Wise Expense – Smart cross-platform expense tracker for mobile and web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.3.3
  path_provider: ^2.1.2
  flutter_local_notifications: ^17.1.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3+3
  path: ^1.9.0
  local_auth: ^2.3.0
  share_plus: ^10.1.2
  crypto: ^3.0.3
  file_picker: ^11.0.2
  image_picker: ^1.2.1
  google_mlkit_text_recognition: ^0.15.1
  home_widget: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  # image: assets/images/app_icon.png
  android: true
  ios: true
  web: true
